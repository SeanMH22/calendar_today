[captive_portal]
username = your-portal-username
password = your-portal-password

# Field names the portal's <form> uses for the login inputs. Defaults below
# are common guesses — if login fails, check the debug HTML saved in
# debug_dir and update these to match the real field names.
username_field = username
password_field = password

retries = 3
retry_delay_seconds = 5
debug_dir = /var/log/captive-portal
