[captive_portal]
username = your-portal-username
password = your-portal-password

# Optional: the portal's own hostname/IP, e.g. http://192.168.1.1/ or
# http://portal.example.com/. Some routers don't reliably redirect the
# generate_204 connectivity probe to the login page — if the script keeps
# failing to find a <form> even though the portal loads fine when you
# browse to it manually, set this to hit it directly instead.
# portal_url = http://192.168.1.1/

# Field names the portal's <form> uses for the login inputs. Defaults below
# are common guesses — if login fails, check the debug HTML saved in
# debug_dir and update these to match the real field names.
username_field = username
password_field = password

retries = 3
retry_delay_seconds = 5
debug_dir = /var/log/captive-portal
